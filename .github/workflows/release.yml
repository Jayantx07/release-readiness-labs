name: Release Pipeline

on:
  push:
    branches:
      - main
      - "investigation/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: v2.3.0
  IMAGE_NAME: lab-app

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  validate-release:
    name: 1 - Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefix app

      - name: Run tests
        run: npm test --prefix app

      - name: Check release version is consistent
        run: |
          PKG="v$(node -p "require('./app/package.json').version")"
          REL="v$(node -p "require('./release/release.json').Version")"
          echo "Workflow: $RELEASE_VERSION | package.json: $PKG | release.json: $REL"
          test "$PKG" = "$RELEASE_VERSION" || { echo "package.json version mismatch"; exit 1; }
          test "$REL" = "$RELEASE_VERSION" || { echo "release.json version mismatch"; exit 1; }
          grep -q "image: ${IMAGE_NAME}:${RELEASE_VERSION}" deployment/kubernetes/deployment.yaml \
            || { echo "Kubernetes image tag does not match release version"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_VERSION" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match $RELEASE_VERSION"; exit 1
          fi
          echo "Version check passed: $RELEASE_VERSION"

      - name: Scan for hardcoded secrets
        run: |
          if grep -rnE "password123|test-api-key|abcd1234|test-secret" \
               --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude="*.md" .; then
            echo "Hardcoded secret found - release blocked"; exit 1
          fi
          echo "No hardcoded secrets found"

  build-artifact:
    name: 2 - Build versioned image
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image tagged with release version and commit
        run: |
          docker build \
            -t "${IMAGE_NAME}:${RELEASE_VERSION}" \
            -t "${IMAGE_NAME}:${RELEASE_VERSION}-${GITHUB_SHA::7}" \
            --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            .
          docker image ls "${IMAGE_NAME}"

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 3000:3000 "${IMAGE_NAME}:${RELEASE_VERSION}"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 2
          done
          echo
          curl -fsS http://localhost:3000/health | grep -q "\"version\":\"${RELEASE_VERSION#v}\""
          echo "Smoke test passed"
          docker rm -f smoke

  deploy-production:
    name: 3 - Deploy to production
    runs-on: ubuntu-latest
    needs: [validate-release, build-artifact]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment:
      name: production   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

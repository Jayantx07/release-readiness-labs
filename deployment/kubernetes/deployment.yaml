apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  labels:
    app: lab-app
    version: v2.3.0
spec:
  replicas: 3
  revisionHistoryLimit: 5          
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            
      maxSurge: 1
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
        version: v2.3.0
    spec:
      containers:
      - name: lab-app
        image: lab-app:v2.3.0        
        ports:
        - containerPort: 3000
        env:
        - name: APP_VERSION
          value: "v2.3.0"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: lab-app-secrets
              key: API_KEY
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab-app-secrets
              key: DATABASE_PASSWORD
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
